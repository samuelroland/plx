[package]
name = "plx"
description = "Practice programming exos in a delightful Learning eXperience"
homepage = "https://github.com/plx-pdg/plx"
repository = "https://github.com/plx-pdg/plx"
license-file = "LICENSE"
readme = false
version = "0.2.0"
edition = "2021"
exclude = ["examples"]

[lib]
name = "plx"

[dependencies]
console = "0.15.8"
serde = { version = "1.0.209", features = ["derive"] }
toml = "0.8.19"
ratatui = "0.28.1"
crossterm = "0.28.1"
similar = { version = "2.6.0", features = ["inline"] }
strum = "0.26.3"
dunce = "1.0.5"
notify = "6.1.1"
notify-debouncer-mini = "0.4.0"
tempfile = "3.12.0"
log = "0.4.22"
simplelog = "0.12.2"
syntect = "5.0"
ansi-to-tui = "6.0.0"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-tungstenite = "0.27.0"
tokio-stream = "0.1.17"
futures-util = "0.3.31"
serde_json = "1.0.140"
ctrlc = "3.4.7"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
ntest = "0.9.3"
pretty_assertions = "1.4.1"
rand = "0.9.1"
