[package]
name = "plx"
description = "Practice programming exos in a delightful Learning eXperience"
homepage = "https://github.com/plx-pdg/plx"
repository = "https://github.com/plx-pdg/plx"
license-file = "LICENSE"
readme = false
version = "0.2.0"
edition = "2021"
exclude = ["examples"]

[lib]
name = "plx"

[dependencies]
console = "0.15.8"
serde = { version = "1.0.209", features = ["derive"] }
toml = "0.8.19"
similar = { version = "2.6.0", features = ["inline"] }
strum = "0.27.1"
strum_macros = "0.27.1"
dunce = "1.0.5"
notify = "6.1.1"
notify-debouncer-mini = "0.4.0"
log = "0.4.22"
simplelog = "0.12.2"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-tungstenite = "0.27.0"
tokio-stream = "0.1.17"
futures-util = "0.3.31"
serde_json = "1.0.140"
ctrlc = "3.4.7"
chrono = { version = "0.4", features = ["serde"] }
typeshare = "1.0.4"
url = "2.5.4"

# Tauri is not used outside of the Tauri desktop app, but we still need to include to use Tauri specta
# and generate some TypeScript types for the frontend
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri = { version = "2.0", features = [] }
ansi-to-html = "0.2.2"

[dev-dependencies]
ntest = "0.9.3"
pretty_assertions = "1.4.1"
rand = "0.9.1"
